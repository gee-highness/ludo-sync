name: Release
# Push a tag like v1.0.0 (or run it by hand) to build every download and attach them to a GitHub release.
on:
  workflow_dispatch:
    inputs:
      tag: { description: "Release tag, e.g. v1.0.0", required: true }
  push:
    tags: ["v*"]

env:
  TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  web:
    # the static bundle every app shares, built once
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: ludo-sync-game } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: ludo-sync-game/package-lock.json }
      - run: npm ci
      - run: npm run build:native
      - uses: actions/upload-artifact@v4
        with: { name: bundle, path: ludo-sync-game/out }

  android:
    needs: web
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: ludo-sync-game } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: ludo-sync-game/package-lock.json }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - run: npm ci
      - run: npm run build:native
      - run: cd android && ./gradlew assembleDebug
      - run: cp android/app/build/outputs/apk/debug/app-debug.apk ludo-sync-android.apk
      - uses: actions/upload-artifact@v4
        with: { name: android, path: ludo-sync-game/ludo-sync-android.apk }

  desktop:
    needs: web
    strategy:
      matrix:
        include:
          - { os: ubuntu-latest, script: dist:linux, name: linux }
          - { os: windows-latest, script: dist:win, name: windows }
    runs-on: ${{ matrix.os }}
    defaults: { run: { working-directory: ludo-sync-game/desktop } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/download-artifact@v4
        with: { name: bundle, path: ludo-sync-game/out }
      - if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y libarchive-tools zstd
      - run: npm install --no-audit --no-fund
      - run: node prepare.mjs
      - run: npm run ${{ matrix.script }}
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.name }}
          path: |
            ludo-sync-game/desktop/dist/*.AppImage
            ludo-sync-game/desktop/dist/*.deb
            ludo-sync-game/desktop/dist/*.pacman
            ludo-sync-game/desktop/dist/*.tar.gz
            ludo-sync-game/desktop/dist/*.exe
            ludo-sync-game/desktop/dist/*.zip

  publish:
    needs: [android, desktop]
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/download-artifact@v4
        with: { path: dl, merge-multiple: true }
      - name: Name the Arch package so pacman -U accepts it
        run: |
          cd dl
          for f in *.pacman; do mv "$f" "${f%.pacman}.pkg.tar.xz"; done
          sha256sum * > SHA256SUMS.txt
          ls -la
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: Ludo Sync ${{ env.TAG }}
          generate_release_notes: true
          files: dl/*
